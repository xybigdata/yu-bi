name: 功能建议 / Feature request
description: 提议新能力或改进现有工作流
title: "[Feature] "
labels:
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述目标使用者、当前工作流和实际阻碍，不要只描述一个界面控件。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 请描述完成后可观察、可验收的行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 说明当前规避方式或其他实现方向及其不足。
  - type: textarea
    id: scope
    attributes:
      label: 范围与兼容性
      description: 说明是否涉及数据迁移、配置、权限、公开接口或兼容性变化。
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附脱敏示例、草图或相关链接。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 我没有在此提交凭据、个人数据或未公开漏洞。
          required: true
