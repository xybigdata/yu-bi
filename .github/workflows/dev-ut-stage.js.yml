# This workflow validates the current frontend baseline on the supported Node 24 runtime.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Node.js from frontend/.nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Use Temurin JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify frontend toolchain
        run: |
          npm install -g npm@11.13.0
          npm run verify:toolchain
        working-directory: ./frontend
      - run: npm ci
        working-directory: ./frontend
      - name: Verify CI workflow contracts
        run: node --test .github/scripts/*.test.mjs
      - run: npm run checkTs
        working-directory: ./frontend
      - run: npm run build:task
        working-directory: ./frontend
      - run: npm run build --if-present
        working-directory: ./frontend
      - name: Report frontend build size
        run: |
          npm run build:report
          YU_BI_CHUNK_REPORT_FORMAT=json YU_BI_CHUNK_REPORT_ONLY_OVERSIZED=1 YU_BI_CHUNK_REPORT_OUTPUT=build/build-report.json npm run build:report
          YU_BI_CHUNK_REPORT_BASELINE_REPORT=build/build-report.json npm run build:report:check
          npm run build:report:gzip:check:current
        working-directory: ./frontend
      - name: Upload frontend build size reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build-report
          path: |
            frontend/build/build-report.json
            frontend/build/build-report-gzip.json
          if-no-files-found: error
      - run: npm run test:ci
        working-directory: ./frontend
      - run: npm run lint:css
        working-directory: ./frontend
      - run: npm run lint:style
        working-directory: ./frontend
      - name: Run full backend tests
        run: mvn -B -ntp -Dexec.skip=true clean test
      - name: Build clean release package
        run: mvn -B -ntp -DskipTests clean package
      - name: Verify release package contract
        run: |
          version="$(node -p "require('./frontend/package.json').version")"
          bash ./scripts/check-release-package.sh "yu-bi-server-v${version}-install.zip" "${version}"
      - run: bash ./scripts/check-demo-health.sh
