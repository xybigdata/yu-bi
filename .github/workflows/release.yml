name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要重新发布的现有 v* 标签"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: 验证并发布
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Verify immutable release ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "发布标签格式无效: ${RELEASE_TAG}" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "检出提交 ${head_commit} 与标签 ${RELEASE_TAG} 指向 ${tag_commit} 不一致" >&2
            exit 1
          fi

      - name: Use Node.js from frontend/.nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: "frontend/.nvmrc"
          cache: npm
          cache-dependency-path: "frontend/package-lock.json"

      - name: Use Temurin JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install -g npm@11.13.0
          npm ci

      - name: Verify workflow contracts
        run: node --test .github/scripts/*.test.mjs

      - name: Run full frontend verification
        working-directory: frontend
        run: |
          npm run verify:toolchain
          npm run checkTs
          npm run test:ci
          npm run lint
          npm run lint:css
          npm run lint:style
          npm run build:all
          npm run build:report:check:current
          npm run build:report:gzip:check:current

      - name: Run full backend tests
        run: mvn -B -ntp -Dexec.skip=true clean test

      - name: Build clean release package
        run: mvn -B -ntp -DskipTests clean package

      - name: Resolve release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          package_name="yu-bi-server-${RELEASE_TAG}-install.zip"
          sbom_name="yu-bi-${RELEASE_TAG}-sbom.spdx.json"
          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          if [[ ! -f "${package_name}" ]]; then
            echo "发布包不存在: ${package_name}" >&2
            exit 1
          fi
          if [[ ! -s "${notes_file}" ]]; then
            echo "Release Notes 不存在或为空: ${notes_file}" >&2
            exit 1
          fi
          mkdir -p release
          cp "${package_name}" "release/${package_name}"
          echo "package_name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "sbom_name=${sbom_name}" >> "${GITHUB_OUTPUT}"
          echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Verify release package contract
        run: bash scripts/check-release-package.sh "release/${{ steps.assets.outputs.package_name }}" "${RELEASE_TAG}"

      - name: Run packaged application health check
        env:
          YUBI_DEMO_INSTALL_ZIP_GLOB: release/${{ steps.assets.outputs.package_name }}
        run: bash scripts/check-demo-health.sh

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          file: release/${{ steps.assets.outputs.package_name }}
          format: spdx-json
          output-file: release/${{ steps.assets.outputs.sbom_name }}
          upload-artifact: false
          upload-release-assets: false

      - name: Generate and verify checksums
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "${{ steps.assets.outputs.package_name }}" "${{ steps.assets.outputs.sbom_name }}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest release package provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/${{ steps.assets.outputs.package_name }}

      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="${{ steps.assets.outputs.notes_file }}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release/* --clobber
            gh release edit "${RELEASE_TAG}" --notes-file "${notes_file}" --latest
          else
            gh release create "${RELEASE_TAG}" release/* --notes-file "${notes_file}" --verify-tag --latest --title "${RELEASE_TAG}"
          fi
